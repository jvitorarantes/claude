name: Notificações da Roça Feliz

on:
  schedule:
    - cron: '*/5 * * * *'    # reserva: o relógio do GitHub atrasa muito e às vezes pula horas
  workflow_dispatch: {}       # disparo na hora: botão "Run workflow" e o cron-job.org (a cada 1 minuto, veja NOTIFICACOES.md)

concurrency:
  group: notificacoes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # guarda o firebase-admin já instalado para as próximas vezes (roda bem mais rápido)
      - uses: actions/cache@v4
        with:
          path: servidor/node_modules
          key: node-${{ hashFiles('servidor/package.json') }}
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: node notificacoes.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://jvitorarantes.github.io/roca-feliz/
