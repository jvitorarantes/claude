<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roça Feliz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Baloo+2:wght@400;600;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --wood: #7a4a22;
    --wood-2: #a86b38;
    --wood-3: #d39a5c;
    --panel: #f1f7e7;
    --panel-2: #e2eecf;
    --ink: #2f2a1f;
    --muted: #6a6a52;
    --leaf: #4f9a2f;
    --leaf-d: #2f6e1e;
    --gold: #f2b705;
    --red: #c8402f;
    --xp: #4aa3df;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(#bfe6f7, #d7efc0 260px, #cfe6b0);
    color: var(--ink);
    font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.35;
    padding: 12px 16px 28px;
    min-height: 100%;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--xp); outline-offset: 2px; }
  .app { max-width: 1240px; margin: 0 auto; display: grid; gap: 12px; }

  /* HUD */
  .hud {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
    background: var(--wood); color: #fff1d6;
    border-radius: 14px; padding: 8px 16px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.22), 0 2px 0 rgba(0,0,0,.08);
  }
  .brand {
    font-family: 'Chewy', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1;
    color: #ffe08a; text-shadow: 0 3px 0 #4a2a10; letter-spacing: .5px;
  }
  .hud .spacer { flex: 1; }
  .stat { display: flex; align-items: center; gap: 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lvl {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: #ffd54a; color: #5a3a0c; font-size: 18px;
    box-shadow: inset 0 -3px 0 #d69c00;
  }
  .xpwrap { display: grid; gap: 2px; min-width: 150px; }
  .xpwrap small { font-weight: 600; opacity: .85; font-size: 12px; }
  .xpbar { height: 10px; border-radius: 6px; background: rgba(0,0,0,.3); overflow: hidden; }
  .xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(#7cc8f5, var(--xp)); transition: width .3s; }
  .coin {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff2a8, var(--gold) 55%, #c98c00);
    box-shadow: inset 0 0 0 2px #b77f00;
  }
  .coins { font-size: 20px; }
  .acct { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .acct img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ffe08a; background: #fff; }
  .acct .who { display: grid; line-height: 1.15; }
  .acct .who small { opacity: .8; font-weight: 400; }
  .acct-note { opacity: .85; font-size: 13px; }
  .gbtn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: #3c4043; border: 0; border-radius: 20px;
    padding: 5px 14px 5px 8px; font-weight: 700; font-size: 14px;
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .gbtn svg { width: 20px; height: 20px; }
  .linkbtn { background: none; border: 0; color: #ffe08a; text-decoration: underline; padding: 0; font-size: 13px; }

  /* Principal */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 12px; align-items: start; }
  @media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
  .left { display: grid; gap: 10px; min-width: 0; }

  .banner {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between;
    background: #fff3c4; border: 3px solid var(--wood-3); border-radius: 12px; padding: 6px 12px;
    font-weight: 600;
  }
  .scenebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; background: var(--wood-2); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button {
    border: 0; border-radius: 9px; padding: 4px 14px; font-weight: 800;
    background: transparent; color: #fff1d6;
  }
  .seg button[aria-selected="true"] { background: var(--panel); color: var(--wood); }
  .seg.small button { padding: 3px 10px; font-size: 13px; }
  .sceneinfo { font-weight: 700; color: var(--wood); font-size: 14px; font-variant-numeric: tabular-nums; }

  .stage {
    position: relative; border: 5px solid var(--wood); border-radius: 16px; overflow: hidden;
    background: #8cc84b; aspect-ratio: 16 / 10; max-width: 100%;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  .tip {
    position: absolute; pointer-events: none; z-index: 3;
    background: rgba(40, 26, 12, .92); color: #fff4df;
    border-radius: 10px; padding: 6px 10px; font-size: 13px; line-height: 1.3;
    max-width: 230px; box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  .tip b { color: #ffe08a; font-size: 14px; }
  .tip .bar { height: 6px; background: rgba(255,255,255,.2); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .tip .bar i { display: block; height: 100%; background: #8fdc5a; }
  .tip .warn { color: #ffb4a4; }
  .toasts { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; z-index: 4; pointer-events: none; width: max-content; max-width: 90%; }
  .toast {
    background: #fffbe8; color: var(--ink); border: 3px solid var(--wood-2);
    border-radius: 12px; padding: 4px 12px; font-weight: 700; text-align: center;
    box-shadow: 0 3px 0 rgba(0,0,0,.15); animation: pop .25s ease-out;
  }
  .toast.bad { border-color: var(--red); color: #7a1d10; }
  .toast.good { border-color: var(--leaf); }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Ferramentas */
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tool {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 3px solid var(--wood-2); border-radius: 12px;
    padding: 4px 10px 4px 6px; font-weight: 700;
    box-shadow: 0 3px 0 var(--wood);
    transition: transform .08s;
  }
  .tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood); }
  .tool svg, .tool img { width: 28px; height: 28px; flex: none; }
  .tool kbd { font: 600 11px/1 'Baloo 2', monospace; color: var(--muted); border: 1px solid #c9c3a8; border-radius: 4px; padding: 2px 4px; }
  .tool[aria-pressed="true"] { background: #ffe08a; border-color: var(--wood); }
  .hintline { color: var(--muted); font-size: 13px; }

  /* Painel */
  .panel { background: var(--panel); border: 4px solid var(--wood-2); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--wood-2); gap: 3px; padding: 4px 4px 0; }
  .tab {
    border: 0; border-radius: 10px 10px 0 0; padding: 6px 2px;
    background: var(--wood-3); color: #4a2a10; font-weight: 800; font-size: 14px;
  }
  .tab[aria-selected="true"] { background: var(--panel); }
  .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 4px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; line-height: 1; vertical-align: 1px; }
  .pane { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; max-height: 640px; overflow-y: auto; overflow-x: hidden; }
  .pane h3 { margin: 4px 0 0; font-family: 'Chewy', cursive; font-weight: 400; font-size: 22px; color: var(--wood); letter-spacing: .3px; }
  .pane p.hint { margin: 0; color: var(--muted); font-size: 13px; }
  .row {
    display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    background: #fff; border: 2px solid var(--panel-2); border-radius: 12px; padding: 6px 8px;
  }
  .row.sel { border-color: var(--gold); background: #fff9df; }
  .row.locked { opacity: .55; }
  .row > img, .row .avatar { width: 48px; height: 48px; }
  .row .avatar { border-radius: 12px; object-fit: cover; display: grid; place-items: center; color: #fff; font: 400 24px Chewy, cursive; }
  .row .name { font-weight: 800; overflow-wrap: anywhere; }
  .row .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn {
    border: 0; border-radius: 10px; padding: 4px 12px; font-weight: 800;
    background: var(--leaf); color: #fff; box-shadow: 0 3px 0 var(--leaf-d);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--leaf-d); }
  .btn:disabled { background: #b7b39c; box-shadow: 0 3px 0 #8f8a73; cursor: not-allowed; }
  .btn.gold { background: #e9a800; box-shadow: 0 3px 0 #a87400; }
  .btn.ghost { background: transparent; color: var(--wood); box-shadow: none; border: 2px solid var(--wood-3); }
  .btn.danger { background: var(--red); box-shadow: 0 3px 0 #862516; }
  .stack { display: grid; gap: 4px; }
  .total { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 800; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 14px 8px; }
  .codebox {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    background: #fff9df; border: 2px dashed var(--gold); border-radius: 12px; padding: 8px 12px;
  }
  .codebox strong { font: 400 26px/1 Chewy, cursive; letter-spacing: 3px; color: var(--wood); user-select: all; }
  .addform { display: flex; gap: 8px; }
  .addform input {
    flex: 1; min-width: 0; border: 2px solid var(--wood-3); border-radius: 10px; padding: 4px 10px;
    background: #fff; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
  }
  .foot { text-align: center; color: var(--muted); font-size: 12px; }
  @media (max-width: 560px) {
    .stage { aspect-ratio: 4 / 3; }
    .toast { font-size: 12px; padding: 2px 8px; }
    .brand { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } .xpbar i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">Roça Feliz</div>
    <div class="stat">
      <div class="lvl" id="lvl" title="Nível">1</div>
      <div class="xpwrap">
        <small id="xptxt">0 / 30 XP</small>
        <div class="xpbar"><i id="xpbar"></i></div>
      </div>
    </div>
    <div class="stat coins"><div class="coin" aria-hidden="true"></div><span id="coins">0</span></div>
    <div class="spacer"></div>
    <div class="acct" id="account"></div>
  </header>

  <div class="main">
    <div class="left">
      <div class="banner" id="banner" hidden>
        <span id="bannerTxt"></span>
        <button class="btn" id="goHome" type="button">Voltar para minha roça</button>
      </div>
      <div class="scenebar">
        <div class="seg" role="tablist" aria-label="Lugar" id="scenes">
          <button type="button" role="tab" data-scene="roca" aria-selected="true">Roça</button>
          <button type="button" role="tab" data-scene="animais" aria-selected="false">Animais</button>
          <button type="button" role="tab" data-scene="casa" aria-selected="false">Casa</button>
        </div>
        <span class="sceneinfo" id="sceneInfo"></span>
      </div>
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="Sua roça"></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="toasts" id="toasts"></div>
      </div>
      <div class="tools" id="tools" role="toolbar" aria-label="Ferramentas"></div>
      <div class="hintline" id="sceneHint" hidden></div>
    </div>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="loja" aria-selected="true">Loja</button>
        <button class="tab" role="tab" data-tab="celeiro" aria-selected="false">Celeiro</button>
        <button class="tab" role="tab" data-tab="terreno" aria-selected="false">Terreno</button>
        <button class="tab" role="tab" data-tab="amigos" aria-selected="false">Amigos</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
  <div class="foot">Atalhos na roça: 1–6 trocam de ferramenta.</div>
</div>

<script src="firebase-config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/game.js"></script>
</body>
</html>
